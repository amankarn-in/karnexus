services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karnexus_fastapi
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
